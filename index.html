<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme, accent, text size and motion before first paint to avoid a flash of the wrong look.
    // js/appearance.js applies them again whenever they change.
    try {
      var saved = { theme: 'board:theme', accent: 'board:accent', text: 'board:text-size', motion: 'board:motion' };
      for (var name in saved) {
        var value = localStorage.getItem(saved[name]);
        if (value) document.documentElement.dataset[name] = value;
      }
    } catch (e) { /* storage blocked: the default look */ }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
